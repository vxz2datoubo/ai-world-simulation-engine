name: I8D B1 Verify Migration

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/i8d_b1_migrate.py'
      - '.github/workflows/i8d-b1-generate.yml'
      - 'contracts/**'
      - 'docs/**'
      - 'evals/**'
      - 'registries/**'
      - 'runtime/**'
      - 'tests/**'
      - '.gitignore'

permissions:
  contents: read

jobs:
  generate-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Verify B1 migration is already materialized and idempotent
        run: |
          output="$(python tools/i8d_b1_migrate.py)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'B1_MIGRATION_ALREADY_MATERIALIZED'
          git diff --exit-code
      - name: Verify full repository
        run: |
          git diff --check
          python -m pytest -q
      - name: Verify exact-head repository remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
