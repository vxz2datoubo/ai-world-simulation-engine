name: I8D B1 Generate Migration

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/i8d_b1_migrate.py'
      - '.github/workflows/i8d-b1-generate.yml'
      - 'contracts/**'
      - 'evals/**'
      - 'registries/**'
      - 'runtime/**'
      - 'tests/**'

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Repair generator source preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/i8d_b1_migrate.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace("replace_text(\"tests/test_i2a_functional_impairment_contract.py\", 'previous_contract_version\") != \"1.8.0-candidate\"', 'previous_contract_version\") != \"1.9.0-candidate\"')", "replace_text(\"tests/test_i2a_functional_impairment_contract.py\", 'lineage.get(\"previous_contract_version\") != \"1.8.0-candidate\"', 'lineage.get(\"previous_contract_version\") != \"1.9.0-candidate\"')")
          t=t.replace("replace_text(\"tests/test_i2a_action_demand_canonical_registration.py\", 'previous_contract_version\"] == \"1.8.0-candidate\"', 'previous_contract_version\"] == \"1.9.0-candidate\"')", "replace_text(\"tests/test_i2a_action_demand_canonical_registration.py\", 'previous_contract_version\"] == \"1.8.0-candidate\"', 'previous_contract_version\"] == \"1.9.0-candidate\"')")
          t=t.replace(
              "    for rel in graph_files:\n        replace_text(rel, OLD_GRAPH, NEW_GRAPH)\n",
              "    for rel in graph_files:\n        replace_text(rel, OLD_GRAPH, NEW_GRAPH)\n        replace_text(rel, OLD_PARENT, NEW_PARENT)\n",
          )
          p.write_text(t, encoding='utf-8')
          PY
          python -m py_compile tools/i8d_b1_migrate.py
      - name: Generate B1 canonical migration
        run: python tools/i8d_b1_migrate.py
      - name: Verify generated repository
        run: |
          git diff --check
          python -m pytest -q
      - name: Commit only after full verification succeeds
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'B1 migration already materialized; no commit required.'
            exit 0
          fi
          git config user.name 'AWRSE B1 Migration Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Apply deterministic I8D B1 canonical migration [b1-generated]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
