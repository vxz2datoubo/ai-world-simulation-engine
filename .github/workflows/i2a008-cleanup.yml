name: I2A-008 generated artifact cleanup

on:
  push:
    branches:
      - gpt/i2a-008-functional-impairment-freeze

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[i2a008-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/i2a-008-functional-impairment-freeze
          fetch-depth: 0
      - name: Remove generated bytecode and temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          rm -f .github/workflows/i2a008-cleanup.yml
          git status --short
      - name: Commit cleanup to same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "I2A-008 remove generated test artifacts [i2a008-clean]"
          git push origin HEAD:gpt/i2a-008-functional-impairment-freeze
