name: I2A-008 final authority discriminator remediation

on:
  push:
    branches:
      - gpt/i2a-008-functional-impairment-freeze

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[i2a008-final-remediated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/i2a-008-functional-impairment-freeze
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Apply bounded authority-graph discriminator remediation
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          GRAPH = "AF001-AUTHORITY-GRAPH-1.9-I2A008@1"
          root = Path('.')
          parent_path = root / 'contracts/AF001-LIVING-STORY-CONTRACTS.json'
          binding_path = root / 'contracts/AF001-FUNCTIONAL-IMPAIRMENT-CAPABILITY-BINDING.json'
          fixture_path = root / 'evals/AF001-FUNCTIONAL-IMPAIRMENT-CAPABILITY-FIXTURES.json'
          test_path = root / 'tests/test_i2a_functional_impairment_contract.py'
          docs_path = root / 'docs/I2A-008-FUNCTIONAL-IMPAIRMENT-FREEZE.md'

          parent_text = parent_path.read_text(encoding='utf-8')
          if '"authority_graph_version": "AF001-AUTHORITY-GRAPH-1.9-I2A008@1"' not in parent_text:
              needle = '  "contract_version": "1.9.0-candidate",\n'
              replacement = needle + f'  "authority_graph_version": "{GRAPH}",\n'
              if parent_text.count(needle) != 1:
                  raise SystemExit('parent contract version insertion point not unique')
              parent_text = parent_text.replace(needle, replacement, 1)

          reg_needle = '''      "parent_contract_version": "1.9.0-candidate",\n      "authority": "MACHINE_CONTRACT_REGISTRY_DELEGATED_EXTENSION",\n      "scope": "AF-C_FUNCTION_LOCAL_INJURY_EVIDENCE_TO_CURRENT_CAPABILITY_APPLICABILITY_PROJECTION",'''
          reg_replacement = f'''      "parent_contract_version": "1.9.0-candidate",\n      "parent_authority_graph_version": "{GRAPH}",\n      "authority": "MACHINE_CONTRACT_REGISTRY_DELEGATED_EXTENSION",\n      "scope": "AF-C_FUNCTION_LOCAL_INJURY_EVIDENCE_TO_CURRENT_CAPABILITY_APPLICABILITY_PROJECTION",'''
          if '"parent_authority_graph_version": "AF001-AUTHORITY-GRAPH-1.9-I2A008@1"' not in parent_text:
              if parent_text.count(reg_needle) != 1:
                  raise SystemExit('functional impairment registration insertion point not unique')
              parent_text = parent_text.replace(reg_needle, reg_replacement, 1)

          old_rule = '  "contract_extension_authority_rule": "ONLY_EXTENSIONS_EXPLICITLY_REGISTERED_BY_THIS_MACHINE_CONTRACT_REGISTRY_ARE_CANONICAL; CHILD_TO_PARENT_SELF_DECLARATION_ALONE_CONFERS_NO_AUTHORITY",'
          new_rule = '  "contract_extension_authority_rule": "ONLY_EXTENSIONS_EXPLICITLY_REGISTERED_BY_THIS_MACHINE_CONTRACT_REGISTRY_ARE_CANONICAL; CHILD_TO_PARENT_SELF_DECLARATION_ALONE_CONFERS_NO_AUTHORITY; FUNCTIONAL_IMPAIRMENT_EXTENSION_AUTHORITY_REQUIRES_EXACT_PARENT_CONTRACT_ID_PLUS_CONTRACT_VERSION_PLUS_AUTHORITY_GRAPH_VERSION_MATCH; MISSING_OR_MISMATCHED_AUTHORITY_GRAPH_VERSION_FAILS_CLOSED",'
          if old_rule in parent_text:
              parent_text = parent_text.replace(old_rule, new_rule, 1)
          elif new_rule not in parent_text:
              raise SystemExit('contract extension authority rule not found')

          vm_needle = '  "versioning_and_migration": {\n    "contract_version_required": true,\n'
          vm_insert = f'''  "versioning_and_migration": {{\n    "contract_version_required": true,\n    "authority_graph_discriminator": {{"field":"authority_graph_version","current":"{GRAPH}","pre_i2a008_state":"FIELD_ABSENT","authorization_tuple":["contract_id","contract_version","authority_graph_version"],"functional_impairment_authorization_rule":"EXACT_TRIPLE_MATCH_REQUIRED; PRE_I2A008_1_9_WITHOUT_AUTHORITY_GRAPH_DISCRIMINATOR_CANNOT_AUTHORIZE_FUNCTIONAL_IMPAIRMENT_EXTENSION"}},\n'''
          if '"authority_graph_discriminator"' not in parent_text:
              if parent_text.count(vm_needle) != 1:
                  raise SystemExit('versioning discriminator insertion point not unique')
              parent_text = parent_text.replace(vm_needle, vm_insert, 1)

          parsed_parent = json.loads(parent_text)
          assert parsed_parent['contract_version'] == '1.9.0-candidate'
          assert parsed_parent['authority_graph_version'] == GRAPH
          assert parsed_parent['registered_contract_extensions']['AWRSE-AF001-ACTION-DEMAND-PROJECTION-BINDING']['parent_contract_version'] == '1.9.0-candidate'
          assert parsed_parent['registered_contract_extensions']['AWRSE-AF001-FUNCTIONAL-IMPAIRMENT-CAPABILITY-BINDING']['parent_authority_graph_version'] == GRAPH
          assert parsed_parent['versioning_and_migration']['contract_version_lineage']['previous_contract_version'] == '1.8.0-candidate'
          parent_path.write_text(parent_text, encoding='utf-8')

          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          assert binding['parent_machine_contract']['contract_version'] == '1.9.0-candidate'
          binding['parent_machine_contract']['authority_graph_version'] = GRAPH
          binding_path.write_text(json.dumps(binding, indent=2) + '\n', encoding='utf-8')

          fixture = json.loads(fixture_path.read_text(encoding='utf-8'))
          assert fixture['parent_contract_version'] == '1.9.0-candidate'
          fixture['parent_authority_graph_version'] = GRAPH
          fixture_path.write_text(json.dumps(fixture, indent=2) + '\n', encoding='utf-8')

          text = test_path.read_text(encoding='utf-8')
          if 'AUTHORITY_GRAPH_VERSION = "AF001-AUTHORITY-GRAPH-1.9-I2A008@1"' not in text:
              lock_needle = '''EXPECTED_LOCKS = {\n    "I2_RUNTIME_AUTHORITY_NOT_GRANTED": True,\n    "NO_I2_RUNTIME_IMPLEMENTED": True,\n    "RUNTIME_SEMANTICS_UNCHANGED": True,\n}\n\n'''
              lock_replacement = lock_needle + f'AUTHORITY_GRAPH_VERSION = "{GRAPH}"\n\n'
              if text.count(lock_needle) != 1:
                  raise SystemExit('test lock constant insertion point not unique')
              text = text.replace(lock_needle, lock_replacement, 1)

          cond_needle = '''        parent.get("contract_id") != "AWRSE-AF001-LIVING-STORY-CONTRACTS"\n        or parent.get("contract_version") != binding.get("parent_machine_contract", {}).get("contract_version")\n        or binding.get("parent_machine_contract", {}).get("contract_id") != parent.get("contract_id")'''
          cond_replacement = '''        parent.get("contract_id") != "AWRSE-AF001-LIVING-STORY-CONTRACTS"\n        or parent.get("authority_graph_version") != AUTHORITY_GRAPH_VERSION\n        or parent.get("contract_version") != binding.get("parent_machine_contract", {}).get("contract_version")\n        or binding.get("parent_machine_contract", {}).get("authority_graph_version") != parent.get("authority_graph_version")\n        or binding.get("parent_machine_contract", {}).get("contract_id") != parent.get("contract_id")'''
          if 'binding.get("parent_machine_contract", {}).get("authority_graph_version")' not in text:
              if text.count(cond_needle) != 1:
                  raise SystemExit('authority condition insertion point not unique')
              text = text.replace(cond_needle, cond_replacement, 1)

          reg_test_needle = '''        or registration.get("parent_contract_version") != parent.get("contract_version")\n        or registration.get("authority") != "MACHINE_CONTRACT_REGISTRY_DELEGATED_EXTENSION"'''
          reg_test_replacement = '''        or registration.get("parent_contract_version") != parent.get("contract_version")\n        or registration.get("parent_authority_graph_version") != parent.get("authority_graph_version")\n        or registration.get("authority") != "MACHINE_CONTRACT_REGISTRY_DELEGATED_EXTENSION"'''
          if 'registration.get("parent_authority_graph_version")' not in text:
              if text.count(reg_test_needle) != 1:
                  raise SystemExit('registration graph assertion insertion point not unique')
              text = text.replace(reg_test_needle, reg_test_replacement, 1)

          lineage_block = '''    if (\n        lineage.get("previous_contract_version") != "1.8.0-candidate"\n        or parent.get("contract_version") != "1.9.0-candidate"\n        or not isinstance(delta, list)\n        or "ACTION_DEMAND_PROJECTION_BINDING_CANONICAL_EXTENSION_REGISTRATION" not in delta\n    ):\n        raise ValueError(error)\n'''
          graph_block = lineage_block + '''\n    graph = parent.get("versioning_and_migration", {}).get("authority_graph_discriminator")\n    if (\n        not isinstance(graph, Mapping)\n        or graph.get("field") != "authority_graph_version"\n        or graph.get("current") != AUTHORITY_GRAPH_VERSION\n        or graph.get("pre_i2a008_state") != "FIELD_ABSENT"\n        or graph.get("authorization_tuple") != ["contract_id", "contract_version", "authority_graph_version"]\n        or "PRE_I2A008_1_9_WITHOUT_AUTHORITY_GRAPH_DISCRIMINATOR_CANNOT_AUTHORIZE_FUNCTIONAL_IMPAIRMENT_EXTENSION" not in graph.get("functional_impairment_authorization_rule", "")\n    ):\n        raise ValueError(error)\n'''
          if 'graph = parent.get("versioning_and_migration", {}).get("authority_graph_discriminator")' not in text:
              if text.count(lineage_block) != 1:
                  raise SystemExit('lineage graph validation insertion point not unique')
              text = text.replace(lineage_block, graph_block, 1)

          first_test_needle = '''    action_registration = parent["registered_contract_extensions"][action_binding["binding_id"]]\n    assert action_registration["parent_contract_version"] == "1.9.0-candidate"\n    assert action_binding["parent_machine_contract"]["contract_version"] == "1.9.0-candidate"\n    assert parent["contract_version"] == "1.9.0-candidate"\n'''
          first_test_replacement = '''    action_registration = parent["registered_contract_extensions"][action_binding["binding_id"]]\n    fixture = _load(FIXTURES_PATH)\n    assert action_registration["parent_contract_version"] == "1.9.0-candidate"\n    assert action_binding["parent_machine_contract"]["contract_version"] == "1.9.0-candidate"\n    assert parent["contract_version"] == "1.9.0-candidate"\n    assert parent["authority_graph_version"] == AUTHORITY_GRAPH_VERSION\n    assert binding["parent_machine_contract"]["authority_graph_version"] == AUTHORITY_GRAPH_VERSION\n    assert fixture["parent_authority_graph_version"] == AUTHORITY_GRAPH_VERSION\n'''
          if 'assert fixture["parent_authority_graph_version"] == AUTHORITY_GRAPH_VERSION' not in text:
              if text.count(first_test_needle) != 1:
                  raise SystemExit('first authority test insertion point not unique')
              text = text.replace(first_test_needle, first_test_replacement, 1)

          mismatch_needle = '''    mismatched_parent = copy.deepcopy(parent)\n    mismatched_parent["registered_contract_extensions"][binding["binding_id"]]["parent_contract_version"] = "1.8.0-candidate"\n    with pytest.raises(ValueError, match="^I2A_FUNCTIONAL_IMPAIRMENT_CANONICAL_BINDING_INVALID$"):\n        _validate_authority(mismatched_parent, binding)\n'''
          mismatch_replacement = mismatch_needle + '''\n    pre_i2a008_same_contract_version = copy.deepcopy(parent)\n    pre_i2a008_same_contract_version.pop("authority_graph_version")\n    pre_i2a008_same_contract_version["versioning_and_migration"].pop("authority_graph_discriminator")\n    with pytest.raises(ValueError, match="^I2A_FUNCTIONAL_IMPAIRMENT_CANONICAL_BINDING_INVALID$"):\n        _validate_authority(pre_i2a008_same_contract_version, binding)\n\n    mismatched_graph = copy.deepcopy(parent)\n    mismatched_graph["registered_contract_extensions"][binding["binding_id"]]["parent_authority_graph_version"] = "AF001-AUTHORITY-GRAPH-1.9-PRE-I2A008@0"\n    with pytest.raises(ValueError, match="^I2A_FUNCTIONAL_IMPAIRMENT_CANONICAL_BINDING_INVALID$"):\n        _validate_authority(mismatched_graph, binding)\n'''
          if 'pre_i2a008_same_contract_version' not in text:
              if text.count(mismatch_needle) != 1:
                  raise SystemExit('pre-I2A008 regression insertion point not unique')
              text = text.replace(mismatch_needle, mismatch_replacement, 1)

          test_path.write_text(text, encoding='utf-8')

          docs = docs_path.read_text(encoding='utf-8')
          marker = '## Authority-graph discriminator remediation'
          if marker not in docs:
              docs += f'''\n\n{marker}\n\nThe AF001 semantic contract version remains `1.9.0-candidate`, but the post-I2A-008 extension-authority graph now carries the separate machine-verifiable discriminator `{GRAPH}`. Functional-impairment extension authority requires an exact `(contract_id, contract_version, authority_graph_version)` match. A pre-I2A-008 AF001 1.9 document, which has no authority-graph discriminator, cannot authorize this extension even if a caller injects a child or registration-shaped object. This removes replay/provenance ambiguity without pretending I2A-008 is a top-level semantic contract migration.\n'''
              docs_path.write_text(docs, encoding='utf-8')
          PY

          python -m pytest -q tests/test_i2a_functional_impairment_contract.py tests/test_i2a_action_demand_admission.py tests/test_i2a_skill_ledger_contract_freeze.py tests/test_af001_architecture_freeze.py
          python -m pytest -q
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          rm -f .github/workflows/i2a008-final-authority-discriminator.yml
          git diff --check
      - name: Commit and push final remediation to same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "I2A-008 bind final authority graph discriminator [i2a008-final-remediated]"
          git push origin HEAD:gpt/i2a-008-functional-impairment-freeze
