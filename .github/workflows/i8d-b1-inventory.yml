name: I8D B1 Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/i8d_b1_inventory.py'
      - '.github/workflows/i8d-b1-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate dependency inventory
        run: python tools/i8d_b1_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: i8d-b1-version-inventory-${{ github.event.pull_request.head.sha }}
          path: b1-inventory.json
          if-no-files-found: error
