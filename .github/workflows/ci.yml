name: R001 Core Runtime CI

on:
  pull_request:
  push:
    branches:
      - main
      - gpt/r001-core-loop

jobs:
  exact-head-test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact implementation head provenance
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "AWRSE_EXPECTED_HEAD=$expected"
          echo "AWRSE_EXACT_HEAD=$actual"
          test "$actual" = "$expected"
          printf 'event=%s\nref=%s\nexpected_head=%s\nactual_head=%s\n' \
            "${{ github.event_name }}" "${{ github.ref }}" "$expected" "$actual" > ci-provenance.txt
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q
      - name: Upload exact-head provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-${{ matrix.python-version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-provenance.txt
