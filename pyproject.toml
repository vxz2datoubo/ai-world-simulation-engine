[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "awrse"
version = "0.0.1"
description = "Autonomous World & Role Simulation Engine prototype"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "runtime"}

[tool.setuptools.packages.find]
where = ["runtime"]

[tool.pytest.ini_options]
pythonpath = ["runtime"]
testpaths = ["tests"]
